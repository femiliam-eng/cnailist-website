<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - Cnailist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .login-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: #fff;
    }
    .login-left .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 50px;
    }
    .logo-icon {
      width: 52px; height: 52px;
      background: #e91e8c;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .logo-text h1 { font-size: 1.5rem; font-weight: 800; }
    .logo-text p  { font-size: 0.78rem; color: rgba(255,255,255,0.5); }
    .nail-showcase {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 340px;
    }
    .nail-showcase img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 14px;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.2s;
    }
    .nail-showcase img:hover { opacity: 1; transform: scale(1.04); }
    .login-tagline {
      margin-top: 36px;
      text-align: center;
    }
    .login-tagline h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    .login-tagline p  { font-size: 0.85rem; color: rgba(255,255,255,0.5); }

    .login-right {
      width: 440px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 48px;
    }
    .login-form-wrap { width: 100%; }
    .login-form-wrap h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2d2d2d;
      margin-bottom: 6px;
    }
    .login-form-wrap .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 32px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #2d2d2d;
      margin-bottom: 7px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      font-size: 0.9rem;
    }
    .input-wrap input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1.5px solid #f0d0dc;
      border-radius: 12px;
      font-size: 0.88rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-wrap input:focus { border-color: #e91e8c; }
    .input-wrap .eye-btn {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 0.9rem;
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .remember-row label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      color: #555;
      cursor: pointer;
    }
    .remember-row input[type="checkbox"] { accent-color: #e91e8c; }
    .remember-row a {
      font-size: 0.82rem;
      color: #e91e8c;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-login-admin {
      width: 100%;
      background: #e91e8c;
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }
    .btn-login-admin:hover { background: #c2185b; transform: translateY(-1px); }
    .error-msg {
      background: #ffebee;
      color: #f44336;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
    .back-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.82rem;
      color: #888;
    }
    .back-link a { color: #e91e8c; font-weight: 600; text-decoration: none; }
    @media (max-width: 768px) {
      .login-left { display: none; }
      .login-right { width: 100%; padding: 40px 28px; }
    }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="login-left">
    <div class="logo">
      <div class="logo-icon">💅</div>
      <div class="logo-text">
        <h1>Cnailist</h1>
        <p>Admin Dashboard</p>
      </div>
    </div>
    <div class="nail-showcase">
      <img src="../images/nail-1.jpeg" alt="nail" />
      <img src="../images/nail-2.jpeg" alt="nail" />
      <img src="../images/nail-3.jpeg" alt="nail" />
      <img src="../images/nail-4.jpeg" alt="nail" />
      <img src="../images/nail-hero.jpeg" alt="nail" />
      <img src="../images/nail-5.jpeg" alt="nail" />
    </div>
    <div class="login-tagline">
      <h2>Kelola Toko dengan Mudah</h2>
      <p>Pantau produk, pesanan, dan pelanggan<br>dalam satu dashboard yang intuitif.</p>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="login-right">
    <div class="login-form-wrap">
      <h2>Selamat Datang 👋</h2>
      <p class="subtitle">Masuk ke panel admin Cnailist</p>

      <div class="error-msg" id="errorMsg">
        <i class="fas fa-exclamation-circle"></i> Email atau password salah.
      </div>

      <div class="form-group">
        <label>Email Admin</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="adminEmail" placeholder="admin@cnailist.id" value="admin@cnailist.id" />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="adminPass" placeholder="••••••••" value="admin123" />
          <button class="eye-btn" onclick="togglePass()" type="button">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <label>
          <input type="checkbox" checked /> Ingat saya
        </label>
        <a href="#">Lupa password?</a>
      </div>

      <button class="btn-login-admin" onclick="doLogin()">
        <i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard
      </button>

      <p class="back-link">
        Kembali ke <a href="../index.html">halaman toko</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Kalau sudah login, langsung ke dashboard
    if (isAdminLoggedIn()) window.location.href = 'index.html';

    function togglePass() {
      const input = document.getElementById('adminPass');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    async function doLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const pass  = document.getElementById('adminPass').value.trim();
      const err   = document.getElementById('errorMsg');
      const btn   = document.querySelector('.btn-login-admin');

      if (!email || !pass) {
        showError('Email dan password wajib diisi.');
        return;
      }

      // Loading state
      btn.disabled     = true;
      btn.innerHTML    = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';

      try {
        const res = await authAPI.login(email, pass);
        setToken(res.token);
        localStorage.setItem('cnailist_admin_info', JSON.stringify(res.admin));
        window.location.href = 'index.html';
      } catch (e) {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard';

        if (e.status === 401) {
          showError('Email atau password salah.');
        } else if (e.message && e.message.includes('fetch')) {
          showError('Tidak bisa terhubung ke server. Pastikan backend berjalan.');
        } else {
          showError(e.message || 'Terjadi kesalahan. Coba lagi.');
        }
      }
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${msg}`;
      err.classList.add('show');
      setTimeout(() => err.classList.remove('show'), 4000);
    }

    // Enter key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
